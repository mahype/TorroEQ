[package]
name = "torroeq"
version = "0.1.0"
edition = "2024"
description = "A precise, keyboard-first system equalizer for PipeWire and macOS"
license = "MIT"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
directories = "6.0"
ratatui = "0.30.2"
rtrb = "0.4"
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
# Only the PipeWire features TorroEQ uses (OBJECT_REGISTER), so it builds on older distributions.
pipewire = { version = "0.10.1", features = ["v0_3_32"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
